<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIRE Navigator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>FIRE Navigator</h1>
  </header>

  <div class="layout">
    <aside id="form-panel">
      <section id="section-settings">
        <h2>基本設定</h2>
        <div class="form-grid" id="settings-fields"></div>
      </section>

      <section id="section-accounts">
        <h2>口座</h2>
        <div id="accounts-list"></div>
        <button type="button" class="add-row-btn" id="add-account-btn">＋ 口座を追加</button>
      </section>

      <section id="section-incomes">
        <h2>収入</h2>
        <div id="incomes-list"></div>
        <button type="button" class="add-row-btn" id="add-income-btn">＋ 収入を追加</button>
      </section>

      <section id="section-expenses">
        <h2>支出</h2>
        <div id="expenses-list"></div>
        <button type="button" class="add-row-btn" id="add-expense-btn">＋ 支出を追加</button>
      </section>

      <section id="section-allocation-policy">
        <h2>配分方針（任意）</h2>
        <div id="allocation-policy-list"></div>
        <button type="button" class="add-row-btn" id="add-allocation-target-btn">＋ 年齢帯を追加</button>
      </section>

      <section id="section-children">
        <h2>子供・教育費（任意）</h2>
        <h3>子供</h3>
        <div id="children-list"></div>
        <button type="button" class="add-row-btn" id="add-child-btn">＋ 子供を追加</button>
        <h3>教育費</h3>
        <div id="education-expenses-list"></div>
        <button type="button" class="add-row-btn" id="add-education-expense-btn">＋ 教育費を追加</button>
      </section>

      <div id="run-area">
        <label class="checkbox-row">
          <input type="checkbox" id="include-montecarlo-checkbox">
          モンテカルロ/ヒストリカルも実行する（重い処理、数十秒〜数分）
        </label>
        <button type="button" id="run-btn">シミュレーション実行</button>
        <p class="run-note">チェックを外すと、決定論的シミュレーション・感応度分析のみの簡易計算になります（数秒で完了します）。</p>
        <div id="run-status"></div>
      </div>
    </aside>

    <main id="results-panel">
      <h2>結果</h2>
      <div id="results-empty">左のフォームを入力し、「シミュレーション実行」を押してください。</div>
      <div id="results-content" hidden>
        <div id="kpi-cards"></div>

        <div id="monthly-detail-section" hidden>
          <h3>月次詳細</h3>
          <details class="table-view">
            <summary id="monthly-detail-summary">表で見る</summary>
            <div id="monthly-detail-table" class="scrollable-table"></div>
          </details>
        </div>

        <h3>純資産推移</h3>
        <figure class="chart-card">
          <div class="chart-canvas-wrap chart-canvas-wrap-large">
            <canvas id="networth-chart"></canvas>
          </div>
          <details class="table-view">
            <summary>表で見る</summary>
            <div id="networth-table"></div>
          </details>
        </figure>

        <div id="montecarlo-section" hidden>
          <h3>モンテカルロ・ヒストリカル分布</h3>
          <div class="percentile-charts">
            <figure class="chart-card" id="montecarlo-chart-card" hidden>
              <figcaption>モンテカルロ</figcaption>
              <div class="chart-canvas-wrap">
                <canvas id="montecarlo-chart"></canvas>
              </div>
              <p class="chart-note" hidden></p>
              <details class="table-view">
                <summary>表で見る</summary>
                <div id="montecarlo-table"></div>
              </details>
            </figure>
            <figure class="chart-card" id="historical-chart-card" hidden>
              <figcaption>ヒストリカル</figcaption>
              <div class="chart-canvas-wrap">
                <canvas id="historical-chart"></canvas>
              </div>
              <details class="table-view">
                <summary>表で見る</summary>
                <div id="historical-table"></div>
              </details>
            </figure>
          </div>
        </div>

        <h3>感応度分析</h3>
        <p class="chart-note">中央値（±0%行・現在のインフレ率列）を基準に、青は良化・赤は悪化を表す。</p>
        <div id="sensitivity-table"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
